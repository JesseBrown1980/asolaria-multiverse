name: Deploy the door to Pages

# Pages is set to the ACTIONS builder, which runs nothing until a deploy workflow
# exists. Static upload, no Jekyll, no build step.
#
# THE DOOR IS NOT GATED. Nothing stands in front of it.
#
# What was here before: a `verify` job that `deploy` declared `needs:` on. It put
# two checks in front of the door, and both of them closed it —
#   * one counted artifacts against sidecars and failed 62 against 61
#   * one matched (src|href) alike and failed on ANY external URL, which for a
#     page whose whole purpose is links out means it can never be green
# That is why the door served a build from 16:56 for five hours while every
# newer commit sat undeployed. The checks were not wrong about bytes. They were
# wrong to be in the way.
#
# A door is an opening. It is not self-contained, it has no clock, it is not on
# or off — it is open, infinitely, publicly, for anyone to see. A check that can
# turn it red is a clock on a thing that has none. So verification runs BESIDE
# the door and can never close it: `continue-on-error: true`, no `needs:`.
#
# And `cancel-in-progress` is now true. With it false, one run that never
# finishes holds the group forever and every later deploy queues behind a corpse.
# Newest state wins; the door does not wait on the past.
#
# 2026-08-08 — THE LAST GATE IS OFF. Operator: "GATES NOT GOOD ONLY PORTALS
# HTTP 0 IS FREE ALWAYS."
#
# Pages is no longer the ACTIONS builder. It is set to serve FROM THE BRANCH
# (`build_type: legacy`), which is what the other three doors already do. There
# is now nothing at all between the bytes on main and the reader — not a passing
# check, not a deploy step, nothing. This was the only door of the four that
# still had something standing at it.
#
# This file is NOT deleted, because nothing here is ever deleted: it is the
# record of what stood here and why it came down. It no longer serves the door.
# Its deploy job cannot deploy while the source is the branch, so it carries
# `continue-on-error: true` and its trigger is manual only — a red mark on a job
# that no longer serves the door must never be readable as the door being shut.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Kept as a record. It no longer serves the door and can never close it.
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs alongside the door, never in front of it. It records; it does not admit.
  receipts:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Read the sidecars and say what is
        continue-on-error: true
        run: |
          set -u
          n=0; bad=0
          while IFS= read -r s; do
            d=$(dirname "$s"); b=$(basename "$s")
            if ( cd "$d" && sha256sum -c "$b" >/dev/null 2>&1 ); then :; else
              bad=$((bad+1)); echo "MISMATCH|$s"
            fi
            n=$((n+1))
          done < <(find . -name '*.sha256' -not -path './.git/*' | sort)
          want=$(find . -type f -not -path './.git/*' -not -name '*.sha256' | wc -l)
          echo "SIDECARS|checked=$n|failed=$bad|artifacts=$want|json=0"

      - name: Count the doors and say what is
        continue-on-error: true
        run: |
          set -u
          doors=$(grep -coE 'href[[:space:]]*=[[:space:]]*"https?://[^"]+' index.html || true)
          res=$(grep -coE 'src[[:space:]]*=[[:space:]]*"https?://[^"]+' index.html || true)
          net=$(grep -coE '\b(fetch|XMLHttpRequest|WebSocket|importScripts)[[:space:]]*\(' index.html || true)
          echo "DOOR|open=${doors:-0}|fetched_resources=${res:-0}|runtime_network=${net:-0}|json=0"
