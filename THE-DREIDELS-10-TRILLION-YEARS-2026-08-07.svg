<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="ui-monospace,monospace">
<rect width="1400" height="900" fill="#06060e"/>
<text x="40" y="46" fill="#e4e2f0" font-size="21" letter-spacing="2">THE DREIDELS SPIN FOR 10 TRILLION YEARS — matrix time cheat: each spin indexed, O(1) to any year</text>
<text x="40" y="72" fill="#6a6a82" font-size="13">elapsed time is metadata &#183; no year was waited &#183; spin i = sha256(seed | i), so year 10,000,000,000,000 is reached in one step</text>
<g transform="translate(294,396) rotate(-42)" opacity="0.08"><polygon points="-46,-46 46,-46 46,46 -46,46" fill="#2a2740" stroke="#5a5578" stroke-width="2"/><polygon points="-46,46 46,46 0,110" fill="#221f36" stroke="#5a5578" stroke-width="2"/><rect x="-8" y="-92" width="16" height="46" rx="4" fill="#3a3556"/></g><g transform="translate(301,396) rotate(-21)" opacity="0.14"><polygon points="-46,-46 46,-46 46,46 -46,46" fill="#2a2740" stroke="#5a5578" stroke-width="2"/><polygon points="-46,46 46,46 0,110" fill="#221f36" stroke="#5a5578" stroke-width="2"/><rect x="-8" y="-92" width="16" height="46" rx="4" fill="#3a3556"/></g><g transform="translate(308,396) rotate(0)" opacity="0.90"><polygon points="-46,-46 46,-46 46,46 -46,46" fill="#2a2740" stroke="#5a5578" stroke-width="2"/><polygon points="-46,46 46,46 0,110" fill="#221f36" stroke="#5a5578" stroke-width="2"/><rect x="-8" y="-92" width="16" height="46" rx="4" fill="#3a3556"/></g><text x="284" y="382" fill="#dfe0ea" font-size="24">נ</text><text x="330" y="382" fill="#dfe0ea" font-size="24">ג</text><text x="284" y="422" fill="#dfe0ea" font-size="24">ה</text><text x="330" y="422" fill="#dfe0ea" font-size="24">ש</text><text x="252" y="546" fill="#8a88a0" font-size="12">four faces, one point &#183; the 3-start winding</text>
<text x="644" y="112" fill="#9a98aa" font-size="12">faces over 3,000,000 measured spins — uniform, as a fair dreidel must be</text>
<rect x="644" y="121" width="70" height="299" fill="#3b6fd6" opacity="0.85"/><text x="679" y="440" text-anchor="middle" fill="#c9c6d6" font-size="13">נ nun</text><text x="679" y="115" text-anchor="middle" fill="#8a88a0" font-size="11">749,875</text><rect x="744" y="121" width="70" height="299" fill="#e0c23a" opacity="0.85"/><text x="779" y="440" text-anchor="middle" fill="#c9c6d6" font-size="13">ג gimel</text><text x="779" y="115" text-anchor="middle" fill="#8a88a0" font-size="11">750,253</text><rect x="844" y="120" width="70" height="300" fill="#8a86c8" opacity="0.85"/><text x="879" y="440" text-anchor="middle" fill="#c9c6d6" font-size="13">ה hey</text><text x="879" y="114" text-anchor="middle" fill="#8a88a0" font-size="11">750,279</text><rect x="944" y="121" width="70" height="299" fill="#d0708a" opacity="0.85"/><text x="979" y="440" text-anchor="middle" fill="#c9c6d6" font-size="13">ש shin</text><text x="979" y="115" text-anchor="middle" fill="#8a88a0" font-size="11">749,593</text><text x="644" y="492" fill="#9a98aa" font-size="12">ternary states −1 / 0 / +1 (blue / yellow / superposition)</text>
<rect x="644" y="500" width="70" height="160" fill="#3b6fd6" opacity="0.85"/><text x="679" y="678" text-anchor="middle" fill="#c9c6d6" font-size="12">-1</text><text x="679" y="494" text-anchor="middle" fill="#8a88a0" font-size="10">1,008,713</text><rect x="744" y="503" width="70" height="157" fill="#e0c23a" opacity="0.85"/><text x="779" y="678" text-anchor="middle" fill="#c9c6d6" font-size="12">0</text><text x="779" y="497" text-anchor="middle" fill="#8a88a0" font-size="10">996,015</text><rect x="844" y="503" width="70" height="157" fill="#b8b6c8" opacity="0.85"/><text x="879" y="678" text-anchor="middle" fill="#c9c6d6" font-size="12">+1</text><text x="879" y="497" text-anchor="middle" fill="#8a88a0" font-size="10">995,272</text><rect x="84" y="648" width="360" height="120" rx="8" fill="#0c0c16" stroke="#3a3556"/><text x="112" y="693" fill="#cfc9dd" font-size="13">year 10,000,000,000,000 lands on:</text><text x="112" y="747" fill="#e0c23a" font-size="30">ש  shin  ·  0 yellow</text><text x="112" y="783" fill="#6a6a82" font-size="11">reached in one step, not 10 trillion &#183; timer_verdict=0</text><text x="40" y="882" fill="#55536a" font-size="12">the spin is fair and deterministic &#183; the year is a metadata index, cheated by content-addressing &#183; SYSTEM_AFFIRMED=0</text>
</svg>
